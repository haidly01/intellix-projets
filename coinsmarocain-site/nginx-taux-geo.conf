# Geo visiteur (Cloudflare CF-IPCountry) + taux quotidiens.
# Inclus depuis le vhost coinsmarocain. Pas de cache sur geo.

location = /api/geo.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    return 200 '{"country":"$http_cf_ipcountry"}';
}

location = /api/taux.json {
    alias /var/www/coinsmarocain/assets/taux.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Access-Control-Allow-Origin "*" always;
}
