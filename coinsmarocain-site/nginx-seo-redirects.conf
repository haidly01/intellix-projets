# Coins Marocain — redirects SEO (trailing slash / hubs dossiers / .html manquants)
# À fusionner dans /etc/nginx/sites-enabled/coinsmarocain (server HTTPS apex)
#
# CRITICAL: if you redirect /index.html → /, you MUST also serve / explicitly,
# otherwise nginx index module does / → /index.html → / (infinite 301 loop).
location = / {
    try_files /index.html =404;
}

# Leaf pages: trailing slash → clean
location = /forfaits/ { return 301 https://coinsmarocain.com/villas-riads-marrakech; }
location = /partenaires/ { return 301 https://coinsmarocain.com/partenaires; }
location = /carnet/ { return 301 https://coinsmarocain.com/carnet; }
location = /affiliation/ { return 301 https://coinsmarocain.com/affiliation; }
location = /agence-de-voyage/ { return 301 https://coinsmarocain.com/agence-de-voyage; }
location = /wedding-planner/ { return 301 https://coinsmarocain.com/wedding-planner; }
location = /journee-piscine/ { return 301 https://coinsmarocain.com/journee-piscine; }
location = /confidentialite/ { return 301 https://coinsmarocain.com/confidentialite; }
location = /en/villas-riads/ { return 301 https://coinsmarocain.com/en/villas-riads; }
location = /contact/ { return 301 https://coinsmarocain.com/contact; }
location = /contact {
    try_files /contact.html =404;
}
location = /contact.html { return 301 https://coinsmarocain.com/contact; }
location = /carte/ { return 301 https://coinsmarocain.com/carte; }
location = /carte {
    try_files /carte.html =404;
}
location = /carte.html { return 301 https://coinsmarocain.com/carte; }

# Empty dirs → hubs
location = /activites/ { return 301 https://coinsmarocain.com/activites; }
location = /evenements/ { return 301 https://coinsmarocain.com/evenements; }
location = /notre-selection/ { return 301 https://coinsmarocain.com/; }
# EN events hub (dir index) — ne pas renvoyer vers /en/
location = /en/events/ {
    try_files /en/events/index.html =404;
}
location = /en/events {
    try_files /en/events.html =404;
}
location = /en/events.html { return 301 https://coinsmarocain.com/en/events; }
# Anciens slugs carte plein-air → experiences
location = /carte/plein-air { return 301 https://coinsmarocain.com/carte/experiences; }
location = /carte/plein-air/ { return 301 https://coinsmarocain.com/carte/experiences; }
location = /en/map/outdoors { return 301 https://coinsmarocain.com/en/map/experiences; }
location = /en/map/outdoors/ { return 301 https://coinsmarocain.com/en/map/experiences; }
location = /en/packages { return 301 https://coinsmarocain.com/en/villas-riads; }
location = /en/packages/ { return 301 https://coinsmarocain.com/en/villas-riads; }
location = /carnet {
    try_files /carnet.html =404;
}
location = /carnet.html { return 301 https://coinsmarocain.com/carnet; }

# Guide escapades (hub + destinations FR/EN)
location = /guide-marrakech {
    try_files /guide-marrakech/index.html =404;
}
location = /guide-marrakech/ {
    try_files /guide-marrakech/index.html =404;
}
location ~ ^/guide-marrakech/([a-z0-9-]+)/?$ {
    try_files /guide-marrakech/$1.html =404;
}
location = /en/guide-marrakech {
    try_files /en/guide-marrakech/index.html =404;
}
location = /en/guide-marrakech/ {
    try_files /en/guide-marrakech/index.html =404;
}
location ~ ^/en/guide-marrakech/([a-z0-9-]+)/?$ {
    try_files /en/guide-marrakech/$1.html =404;
}

# Remaining .html → clean (extend existing rules)
location = /affiliation.html { return 301 https://coinsmarocain.com/affiliation; }
location = /wedding-planner.html { return 301 https://coinsmarocain.com/wedding-planner; }
location = /agence-de-voyage.html { return 301 https://coinsmarocain.com/agence-de-voyage; }
location = /journee-piscine.html { return 301 https://coinsmarocain.com/journee-piscine; }
location = /index.html { return 301 https://coinsmarocain.com/; }
location = /en/index.html { return 301 https://coinsmarocain.com/en/; }
# Blog hub: /blog → /blog/ → index.html (sans ça, try_files $uri.html =404)
location = /blog { return 301 https://coinsmarocain.com/blog/; }
location = /blog/ {
    try_files /blog/index.html =404;
}
location = /blog/index.html { return 301 https://coinsmarocain.com/blog/; }
location /blog/ {
    try_files $uri $uri.html $uri/index.html =404;
}


location = /villas-riads-marrakech {
    try_files /villas-riads-marrakech.html =404;
}
location = /villas-riads-marrakech/ { return 301 https://coinsmarocain.com/villas-riads-marrakech; }
location = /forfaits { return 301 https://coinsmarocain.com/villas-riads-marrakech; }
location = /forfaits/ { return 301 https://coinsmarocain.com/villas-riads-marrakech; }
location = /forfaits.html { return 301 https://coinsmarocain.com/villas-riads-marrakech; }
