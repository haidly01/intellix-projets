  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600&display=swap');

  :root {
    --cream: #faf6ee;
    --cream-deep: #f2ead9;
    --ink: #262220;
    --ink-soft: #55504a;
    --gold-1: #b5732f;
    --gold-2: #e6b876;
    --gold-3: #8a4f22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(230,184,118,0.22) 0, transparent 42%),
      radial-gradient(circle at 90% 85%, rgba(181,115,47,0.14) 0, transparent 46%);
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    position: relative;
    z-index: 1;
    animation: rise 0.7s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    width: 72%;
    max-width: 260px;
    margin: 0 auto 10px;
    display: block;
  }
  .logo img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .tagline {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 36px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .linkbtn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: #ffffff;
    border: 1px solid rgba(181,115,47,0.28);
    border-radius: 10px;
    text-decoration: none;
    color: var(--ink);
    font-size: 0.96rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    text-align: left;
    box-shadow: 0 1px 2px rgba(38,34,32,0.04);
  }

  .linkbtn:hover, .linkbtn:focus-visible {
    transform: translateY(-2px);
    border-color: var(--gold-1);
    box-shadow: 0 8px 20px rgba(181,115,47,0.16);
    outline: none;
  }

  .linkbtn .icon-wrap {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--gold-2), var(--gold-1));
  }
  .linkbtn .icon-wrap svg {
    width: 19px;
    height: 19px;
    color: #fff;
  }

  .linkbtn .label { flex: 1; }
  .linkbtn .label .primary {
    display: block;
    font-weight: 600;
  }
  .linkbtn .label .secondary {
    display: block;
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .linkbtn.whatsapp {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
    border-color: transparent;
    color: #fff;
  }
  .linkbtn.whatsapp .label .secondary { color: rgba(255,255,255,0.78); }
  .linkbtn.whatsapp .icon-wrap {
    background: rgba(255,255,255,0.18);
  }
  .linkbtn.whatsapp:hover {
    box-shadow: 0 10px 24px rgba(138,79,34,0.35);
  }

  .contact-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    background: linear-gradient(135deg, var(--gold-2), var(--gold-1));
    border: none;
    border-radius: 10px;
    text-decoration: none;
    color: #fff;
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 4px 14px rgba(181,115,47,0.28);
  }
  .contact-cta:hover, .contact-cta:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(181,115,47,0.34);
    outline: none;
  }
  .contact-cta svg { width: 18px; height: 18px; flex-shrink: 0; }

  .book-cta {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    margin-bottom: 14px;
    background: #fff;
    border: 1.5px solid var(--gold-1);
    border-radius: 10px;
    text-decoration: none;
    color: var(--ink);
    font-size: 0.96rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;

    font-family: inherit;
  }
  .book-cta:hover, .book-cta:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(181,115,47,0.18);
    outline: none;

  .book-cta .icon-wrap {
    width: 38px;
    height: 38px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--gold-2), var(--gold-1));
    color: #fff;
  }
  .book-cta .icon-wrap svg { width: 19px; height: 19px; }
  .book-cta .label { flex: 1; }
  .book-cta .label .primary {
    display: block;
    font-weight: 600;
  }
  .book-cta .label .secondary {
    display: block;
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .divider {
    border: none;
    border-top: 1px solid rgba(181,115,47,0.22);
    margin: 22px 0;
  }

  footer {
    margin-top: 40px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    text-transform: uppercase;
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .linkbtn { transition: none; }
  }
</style>

    var browserLang = (navigator.language || navigator.userLanguage || "fr").toLowerCase();
    var lang = browserLang.indexOf("en") === 0 ? "en" : "fr";

    document.documentElement.setAttribute("lang", lang);

    var dict = translations[lang];
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (dict[key]) {
        el.textContent = dict[key];
      }
    });

    // Planner séjour (assets + API sur coinsmarocain.com)
    var bookBtn = document.getElementById("cmLinksBook");
    if (bookBtn) {
      var interests = bookBtn.getAttribute("data-planner-interests") || "";
      if (interests) document.body.setAttribute("data-planner-interests", interests);
      bookBtn.addEventListener("click", function () {
        function open() {
          if (window.CoinsPlanner) window.CoinsPlanner.open();
        }
        if (window.CoinsPlanner) {
          open();
          return;
        }
        if (!document.querySelector('link[href*="cm-planner.css"]')) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "https://coinsmarocain.com/assets/cm-planner.css?v=cm122";
          document.head.appendChild(link);
        }
        var s = document.createElement("script");
        s.src = "https://coinsmarocain.com/assets/cm-planner.js?v=cm122";
        s.async = true;
        s.onload = open;
        document.head.appendChild(s);
      });
    }
  })();
