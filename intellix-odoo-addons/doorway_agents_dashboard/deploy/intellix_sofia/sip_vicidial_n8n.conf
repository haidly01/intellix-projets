; =============================================================================
; Intellix — Asterisk / VICIdial + bridge n8n (Sofia)
; Stack : VICIdial dialer → enregistrement → AGI → n8n → Deepgram + Claude + EL
;
; PAS de trunk Doorway France dans cette version (CallerID géré par campagne VICIdial).
; Section [doorway-trunk] conservée en commentaire pour activation future.
;
; Déploiement :
;   cp sip_vicidial_n8n.conf /etc/asterisk/extensions_custom.conf
;   # ou inclure : #include extensions_intellix_sofia.conf
;   asterisk -rx "dialplan reload"
; =============================================================================

; --- TRUNK DOORWAY APP (OPTIONNEL — désactivé) ---
; Décommenter si numéro France E164 requis plus tard.
;
;[doorway-trunk]
;type=peer
;host=${DOORWAY_SIP_HOST}
;username=${DOORWAY_SIP_USER}
;secret=${DOORWAY_SIP_PASS}
;fromuser=${DOORWAY_FR_E164}
;fromdomain=${DOORWAY_SIP_DOMAIN}
;insecure=port,invite
;qualify=yes
;nat=force_rport,commedia
;dtmfmode=rfc2833
;context=doorway-incoming
;disallow=all
;allow=alaw
;allow=ulaw
;canreinvite=no
;trustrpid=yes
;sendrpid=yes

; --- CONTEXTE APPELS ENTRANTS (callback / DID local VICIdial) ---
[intellix-incoming]
; Extension générique — DID mappé dans VICIdial Admin → Inbound
exten => s,1,NoOp(Intellix Sofia — appel entrant ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(AGENT_ID=sofia-intellix-cc-fr-maroc)
 same => n,Set(N8N_WEBHOOK_URL=${N8N_BASE_URL}/webhook/telephony/vicidial/event)
 same => n,AGI(n8n_bridge.agi)
 same => n,Hangup()

; DID explicite (remplacer par votre DID VICIdial)
exten => _X.,1,Goto(intellix-incoming,s,1)

; --- CONTEXTE INTERNE VICIdial → bridge sortant via n8n (si click-to-call) ---
[from-internal-custom]
; Appel manuel test : composer 8XXXX → déclenche AGI bridge
exten => 86000,1,NoOp(Test Sofia n8n bridge)
 same => n,Answer()
 same => n,Set(AGENT_ID=sofia-intellix-cc-fr-maroc)
 same => n,Set(PHONE=${CALLERID(num)})
 same => n,Set(N8N_WEBHOOK_URL=${N8N_BASE_URL}/webhook/telephony/vicidial/event)
 same => n,AGI(n8n_bridge.agi)
 same => n,Hangup()

; --- POST-APPEL VICIdial : enregistrement prêt → AGI ---
[vicidial-auto-external]
; Hook recording (custom — activer dans vicidial_custom.php ou cron AGI)
exten => h,1,NoOp(Hangup handler Sofia)
 same => n,Set(RECORDING_PATH=${MIXMONITOR_FILENAME})
 same => n,Set(CALLID=${UNIQUEID})
 same => n,Set(PHONE=${CALLERID(num)})
 same => n,Set(AGI_EVENT=recording_ready)
 same => n,Set(N8N_WEBHOOK_URL=${N8N_BASE_URL}/webhook/telephony/vicidial/event)
 same => n,AGI(n8n_bridge.agi)
 same => n,Return()

; =============================================================================
; ACTIVATION VICIdial (admin)
; =============================================================================
; 1. Campagnes → Nouvelle campagne sortante Intellix CC Maroc
; 2. Dial Method : RATIO ou ADAPT_AVERAGE
; 3. Agent : utiliser agents IA (user_level 1) ou remote agents
; 4. CallerID : numéro autorisé par votre opérateur (pas Doorway FR pour l'instant)
; 5. Inbound → DID → context intellix-incoming
; 6. Enregistrement : Y + post-call AGI n8n_bridge.agi
; 7. Webhook sortant optionnel : POST vers n8n /webhook/doorway/agents/start-call
; =============================================================================
