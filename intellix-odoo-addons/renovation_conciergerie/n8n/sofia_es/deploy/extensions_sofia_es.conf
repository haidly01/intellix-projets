; Sofia Espagne — VICIdial + TrustSIP + n8n
; Optimisé décroché : ouverture WAV immédiate (Playback dialplan), AMD unique en 8369

[sofia-es-ia]
exten => s,1,NoOp(Sofia ES — conversation IA)
 same => n,Set(AGENT_ID=sofia-es-avatrade-2026)
 same => n,Set(SOFIA_ES_ANSWER=0)
 same => n,Set(SOFIA_OPENING_PATH=/var/lib/asterisk/sounds/sofia/sofia_ouverture)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/sofia-es/vicidial/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/sofia-es-tts)
 same => n,Set(AMD_RESULT=human)
 same => n,Set(PHONE=${DIALEDPEERNUMBER})
 same => n,Playback(sofia/sofia_ouverture,noanswer)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_sofia_es.agi)
 same => n,Hangup()

[sofia-es-outbound]
exten => _X.,1,NoOp(Sofia ES outbound ${EXTEN})
 same => n,Set(PHONE=${EXTEN})
 same => n,Set(CALLERID(num)=34632395675)
 same => n,Dial(SIP/TrustSIP/${EXTEN},90,U(sofia-es-ia^s^1))
 same => n,Hangup()

[sofia-es-bridge]
exten => 86010,1,NoOp(Sofia ES remote agent bridge)
 same => n,Set(AGENT_ID=sofia-es-avatrade-2026)
 same => n,Set(SOFIA_ES_ANSWER=1)
 same => n,Set(SOFIA_OPENING_PATH=/var/lib/asterisk/sounds/sofia/sofia_ouverture)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/sofia-es/vicidial/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/sofia-es-tts)
 same => n,Answer()
 same => n,Set(AMD_RESULT=human)
 same => n,Playback(sofia/sofia_ouverture,noanswer)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_sofia_es.agi)
 same => n,Hangup()

[iso-esp-ia-hook]
exten => s,1,NoOp(Sofia ISO ESP hook ARG1=${ARG1})
 same => n,Set(PHONE=${ARG1})
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s"]?Set(PHONE=${__PHONE}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s"]?Set(PHONE=${DIALEDPEERNUMBER}))
 same => n,Set(AGENT_ID=sofia-es-demo-abdallah)
 same => n,Set(CAMPAIGN=ABD_DEMO)
 same => n,Set(SOFIA_ES_ANSWER=0)
 same => n,Set(SOFIA_OPENING_PATH=/var/lib/asterisk/sounds/sofia/sofia_ouverture)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/sofia-es-demo/vicidial/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/sofia-es-tts)
 same => n,Set(AMD_RESULT=human)
 same => n,Playback(sofia/sofia_ouverture,noanswer)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_sofia_es.agi)
 same => n,Return()

[sofia-es-demo-ia]
exten => s,1,NoOp(Sofia ES demo IA — ABD_DEMO)
 same => n,Set(AGENT_ID=sofia-es-demo-abdallah)
 same => n,Set(CAMPAIGN=ABD_DEMO)
 same => n,Set(SOFIA_ES_ANSWER=0)
 same => n,Set(SOFIA_OPENING_PATH=/var/lib/asterisk/sounds/sofia/sofia_ouverture)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/sofia-es-demo/vicidial/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/sofia-es-tts)
 same => n,Set(AMD_RESULT=human)
 same => n,Set(PHONE=${DIALEDPEERNUMBER})
 same => n,Playback(sofia/sofia_ouverture,noanswer)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_sofia_es.agi)
 same => n,Hangup()

[sofia-es-demo-outbound]
exten => _X.,1,NoOp(Sofia ES demo outbound ${EXTEN})
 same => n,Set(PHONE=${EXTEN})
 same => n,Set(CALLERID(name)=Sofia Demo)
 same => n,Set(CALLERID(num)=34632395675)
 same => n,Dial(SIP/TrustSIP/${EXTEN},90,U(sofia-es-demo-ia^s^1))
 same => n,Hangup()

[abd-demo-bridge]
; Remote agents ABD_DEMO 86011–86018
exten => _8601[1-8],1,NoOp(Sofia ABD_DEMO remote ${EXTEN})
 same => n,Set(AGENT_ID=sofia-es-demo-abdallah)
 same => n,Set(CAMPAIGN=ABD_DEMO)
 same => n,Set(SOFIA_ES_ANSWER=1)
 same => n,Set(SOFIA_OPENING_PATH=/var/lib/asterisk/sounds/sofia/sofia_ouverture)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/sofia-es-demo/vicidial/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/sofia-es-tts)
 same => n,Answer()
 same => n,Set(AMD_RESULT=human)
 same => n,ExecIf($[${LEN(${CALLERID(num)})} >= 20]?Set(PARTNER_ID=${CALLERID(num):10:10}))
 same => n,Set(PHONE=${__PHONE})
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${phone_number}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${VDAD_phone_number}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${CONNECTEDLINE(name)}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${CALLERID(num)}))
 same => n,Playback(sofia/sofia_ouverture,noanswer)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_sofia_es.agi)
 same => n,Hangup()

[iso-esp-bridge]
exten => 86012,1,NoOp(Sofia ES — ISO ESP DWTOISOE)
 same => n,Set(AGENT_ID=sofia-es-demo-abdallah)
 same => n,Set(CAMPAIGN=DWTOISOE)
 same => n,Set(SOFIA_ES_ANSWER=1)
 same => n,Set(SOFIA_OPENING_PATH=/var/lib/asterisk/sounds/sofia/sofia_ouverture)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/sofia-es-demo/vicidial/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/sofia-es-tts)
 same => n,Set(PHONE=${CALLERID(num)})
 same => n,ExecIf($["${PHONE}" = ""]?Set(PHONE=${CONNECTEDLINE(num)}))
 same => n,Answer()
 same => n,Set(AMD_RESULT=human)
 same => n,Playback(sofia/sofia_ouverture,noanswer)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_sofia_es.agi)
 same => n,Hangup()

[default]
exten => 86010,1,Goto(sofia-es-bridge,86010,1)
exten => _8601[1-8],1,Goto(abd-demo-bridge,${EXTEN},1)
exten => 86012,1,Goto(iso-esp-bridge,86012,1)

[from-internal-custom]
exten => 86010,1,Goto(sofia-es-bridge,86010,1)
exten => _8601[1-8],1,Goto(abd-demo-bridge,${EXTEN},1)
exten => 86012,1,Goto(iso-esp-bridge,86012,1)

exten => h,1,GotoIf($["${CONTEXT}" = "sofia-es-ia"]?done)
 same => n,Set(AGI_EVENT=call_ended)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/sofia-es/vicidial/event)
 same => n,AGI(n8n_bridge_sofia_es.agi)
 same => n(done),NoOp(done)
