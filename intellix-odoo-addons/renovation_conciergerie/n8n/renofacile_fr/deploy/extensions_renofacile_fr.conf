; RénoFacile France B2C — DW_FRB2C / Door_App0 / Sofia marenofacile
; Après strip préfixe 9 (default _9.): numéros FR 9 chiffres commençant par 6 ou 7

[renofacile-fr-ia-hook]
exten => s,1,NoOp(RénoFacile FR hook ARG1=${ARG1})
 same => n,Set(PHONE=${ARG1})
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${__PHONE}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${DIALEDPEERNUMBER}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${phone_number}))
 same => n,ExecIf($[${LEN(${CALLERID(num)})} >= 20]?Set(PARTNER_ID=${CALLERID(num):10:10}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${CONNECTEDLINE(name)}))
 same => n,Set(AGENT_ID=marenofacile)
 same => n,Set(CAMPAIGN=DW_FRB2C)
 same => n,Set(STT_LANGUAGE=fr)
 same => n,Set(SOFIA_ES_ANSWER=0)
 same => n,Set(SOFIA_SKIP_OPENING=0)
 same => n,Set(SOFIA_RECORD_PAUSE_SEC=2)
 same => n,Set(SOFIA_RECORD_TIMEOUT=10)
 same => n,Set(SOFIA_OPENING_PATH=/var/lib/asterisk/sounds/sofia/sofia_ouverture)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/renofacile-fr/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/sofia-tts)
 same => n,Set(AMD_RESULT=human)
 same => n,Playback(sofia/sofia_ouverture,noanswer)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_renofacile_fr.agi)
 same => n,Return()
 same => n(amd_machine),Set(AMD_RESULT=machine)
 same => n,Verbose(1,RénoFacile AMD machine ${AMDSTATUS} — hangup sans Sofia)
 same => n,Hangup()

[renofacile-fr-bridge]
; Remote agents Sofia FR (86022–86026)
exten => _8602[2-6],1,NoOp(RénoFacile remote ${EXTEN})
 same => n,Set(AGENT_ID=marenofacile)
 same => n,Set(CAMPAIGN=DW_FRB2C)
 same => n,ExecIf($[${LEN(${CALLERID(num)})} >= 20]?Set(PARTNER_ID=${CALLERID(num):10:10}))
 same => n,Set(PHONE=${__PHONE})
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${phone_number}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${VDAD_phone_number}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${CONNECTEDLINE(name)}))
 same => n,ExecIf($["${PHONE}" = "" | "${PHONE}" = "s" | ${LEN(${PHONE})} < 9]?Set(PHONE=${CALLERID(num)}))
 same => n,ExecIf($[${LEN(${PHONE})} = 9]?Set(PHONE=33${PHONE}))
 same => n,Set(__PHONE=${PHONE})
 same => n,Set(STT_LANGUAGE=fr)
 same => n,Set(SOFIA_ES_ANSWER=1)
 same => n,Set(SOFIA_SKIP_OPENING=0)
 same => n,Set(SOFIA_RECORD_PAUSE_SEC=2)
 same => n,Set(SOFIA_RECORD_TIMEOUT=10)
 same => n,Set(SOFIA_OPENING_PATH=/var/lib/asterisk/sounds/sofia/sofia_ouverture)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/renofacile-fr/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/sofia-tts)
 same => n,Answer()
 same => n,Set(AMD_RESULT=human)
 same => n,Playback(sofia/sofia_ouverture,noanswer)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_renofacile_fr.agi)
 same => n,Hangup()
exten => amd_machine,1,Set(AMD_RESULT=machine)
 same => n,Hangup()

[vicidial-auto-external]
; France mobiles 11 chiffres (336/337XXXXXXXX) — hook Sofia si indicatif conservé
exten => _336XXXXXXXX,1,AGI(agi://127.0.0.1:4577/call_log)
 same => n,Set(PHONE=${EXTEN})
 same => n,Set(__PHONE=${EXTEN})
 same => n,Set(CALLERID(all)=33424436337 <33424436337>)
 same => n,Dial(SIP/Door_App0_FR/${EXTEN},${CAMPDTO},ToU(renofacile-fr-ia-hook^s^1(${EXTEN})))
 same => n,Hangup()
exten => _337XXXXXXXX,1,AGI(agi://127.0.0.1:4577/call_log)
 same => n,Set(PHONE=${EXTEN})
 same => n,Set(__PHONE=${EXTEN})
 same => n,Set(CALLERID(all)=33424436337 <33424436337>)
 same => n,Dial(SIP/Door_App0_FR/${EXTEN},${CAMPDTO},ToU(renofacile-fr-ia-hook^s^1(${EXTEN})))
 same => n,Hangup()
; France mobiles 9 chiffres (6/7XXXXXXXX) — prepend 33 pour Door_App0
exten => _6XXXXXXXX,1,AGI(agi://127.0.0.1:4577/call_log)
 same => n,Set(PHONE=33${EXTEN})
 same => n,Set(__PHONE=33${EXTEN})
 same => n,Set(CALLERID(all)=33424436337 <33424436337>)
 same => n,Dial(SIP/Door_App0_FR/33${EXTEN},${CAMPDTO},ToU(renofacile-fr-ia-hook^s^1(33${EXTEN})))
 same => n,Hangup()
exten => _7XXXXXXXX,1,AGI(agi://127.0.0.1:4577/call_log)
 same => n,Set(PHONE=33${EXTEN})
 same => n,Set(__PHONE=33${EXTEN})
 same => n,Set(CALLERID(all)=33424436337 <33424436337>)
 same => n,Dial(SIP/Door_App0_FR/33${EXTEN},${CAMPDTO},ToU(renofacile-fr-ia-hook^s^1(33${EXTEN})))
