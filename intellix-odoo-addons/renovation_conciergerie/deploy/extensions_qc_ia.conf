; Agents IA Québec — SoumissionEntrepreneurs (86013) + MaisonRecherchee (86014)
; Inclure dans extensions.conf : #include extensions_qc_ia.conf

[se-renov-qc-bridge]
; Remote agent VICIdial SE_RENOV_QC (conf_exten 86013)
exten => 86013,1,NoOp(Émilie SE_RENOV_QC — remote agent)
 same => n,Set(AGENT_ID=sofia-soumission-qc-2026)
 same => n,Set(CAMPAIGN=SE_RENOV_QC)
 same => n,Set(SOFIA_ES_ANSWER=0)
 same => n,Set(SOFIA_SKIP_OPENING=0)
 same => n,Set(SOFIA_RECORD_PAUSE_SEC=5)
 same => n,Set(SOFIA_RECORD_TIMEOUT=12)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/soumission-qc/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/soumission-qc-tts)
 same => n,Answer()
 same => n,AMD(1800,1500,800,3500,120,50,3,256)
 same => n,GotoIf($["${AMDSTATUS}"="MACHINE"]?amd_machine,1)
 same => n,Set(AMD_RESULT=human)
 same => n,Playback(/tmp/greeting_SE)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_soumission_qc.agi)
 same => n,Hangup()
exten => amd_machine,1,Set(AMD_RESULT=machine)
 same => n,Hangup()

[mr-immo-qc-bridge]
; Remote agent VICIdial MR_IMMO_QC (conf_exten 86014)
exten => 86014,1,NoOp(Sophie MR_IMMO_QC — remote agent)
 same => n,Set(AGENT_ID=sophie-maison-immo-qc-2026)
 same => n,Set(CAMPAIGN=MR_IMMO_QC)
 same => n,Set(SOFIA_ES_ANSWER=0)
 same => n,Set(SOFIA_SKIP_OPENING=0)
 same => n,Set(SOFIA_RECORD_PAUSE_SEC=5)
 same => n,Set(SOFIA_RECORD_TIMEOUT=12)
 same => n,Set(N8N_WEBHOOK_URL=https://n8n.intellixcrm.com/webhook/maison-immo-qc/event)
 same => n,Set(STORAGE_BUCKET_URL=https://intellixcrm.com/maison-immo-qc-tts)
 same => n,Answer()
 same => n,AMD(1800,1500,800,3500,120,50,3,256)
 same => n,GotoIf($["${AMDSTATUS}"="MACHINE"]?amd_machine,1)
 same => n,Set(AMD_RESULT=human)
 same => n,Playback(/tmp/greeting_MR)
 same => n,Set(SOFIA_SKIP_OPENING=1)
 same => n,AGI(n8n_maison_immo_qc.agi)
 same => n,Hangup()
exten => amd_machine,1,Set(AMD_RESULT=machine)
 same => n,Hangup()

[default]
exten => 86013,1,Goto(se-renov-qc-bridge,86013,1)
exten => 86014,1,Goto(mr-immo-qc-bridge,86014,1)
